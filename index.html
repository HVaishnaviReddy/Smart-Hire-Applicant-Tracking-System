<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHire | Join Our Team</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Header / Nav -->
    <header>
        <div class="logo">Smart<span>Hire</span></div>
        <nav>
            <a href="/admin" class="btn btn-secondary">HR Dashboard</a>
        </nav>
    </header>

    <!-- Main Content -->
    <div class="container">
        <section class="hero-section">
            <h1>Find Your Dream Job</h1>
            <p>Explore our active job openings and join our fast-growing, innovative global team.</p>
        </section>

        <!-- Search Bar and Count -->
        <div class="glass-panel" style="margin-bottom: 30px; display: flex; gap: 15px; align-items: center; justify-content: space-between; flex-wrap: wrap;">
            <div style="flex-grow: 1; min-width: 280px; position: relative;">
                <input type="text" id="jobSearch" class="form-control" placeholder="Search jobs by title, department, or requirements..." style="padding-left: 40px;">
                <span style="position: absolute; left: 15px; top: 12px; color: var(--text-muted);">🔍</span>
            </div>
            <div id="jobCount" style="font-size: 14px; color: var(--text-secondary); font-weight: 500;">
                Loading active roles...
            </div>
        </div>

        <!-- Jobs Grid -->
        <div id="jobsGrid" class="jobs-grid">
            <!-- Dynamically populated -->
        </div>
    </div>

    <!-- Application Modal -->
    <div id="applyModal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3 id="modalJobTitle">Apply for Position</h3>
                <button type="button" class="close-btn" onclick="closeApplyModal()">&times;</button>
            </div>
            <form id="applyForm">
                <input type="hidden" id="appliedJobId">
                
                <div class="form-group">
                    <label for="candidateName">Full Name *</label>
                    <input type="text" id="candidateName" class="form-control" required placeholder="e.g. John Doe">
                </div>

                <div class="form-group">
                    <label for="candidateEmail">Email Address *</label>
                    <input type="email" id="candidateEmail" class="form-control" required placeholder="e.g. john.doe@example.com">
                </div>

                <div class="form-group">
                    <label for="candidatePhone">Phone Number *</label>
                    <input type="tel" id="candidatePhone" class="form-control" required placeholder="e.g. +1 234 567 890">
                </div>

                <div style="display: grid; grid-template-columns: 1fr; gap: 15px;">
                    <div class="form-group">
                        <label for="experienceYears">Years of Relevant Experience *</label>
                        <input type="number" id="experienceYears" class="form-control" min="0" max="50" required placeholder="e.g. 3">
                    </div>
                </div>

                <div class="form-group">
                    <label for="candidateSkills">Key Skills (Comma separated) *</label>
                    <input type="text" id="candidateSkills" class="form-control" required placeholder="e.g. Java, SQL, REST APIs, Git">
                </div>

                <div class="form-group">
                    <label for="candidateResume">Upload Resume (PDF, DOCX) *</label>
                    <input type="file" id="candidateResume" class="form-control" accept=".pdf,.doc,.docx" required>
                    <small style="color: var(--text-muted); display: block; margin-top: 4px;">Max file size: 5MB</small>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 25px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                    <button type="button" class="btn btn-secondary" onclick="closeApplyModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Submit Application</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast">Application Submitted!</div>

    <script src="/js/app.js"></script>
</body>
</html>
